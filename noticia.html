<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notícia - La Intersindical VDD</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .article-header {
      padding: 6rem 0 2rem;
      background: var(--secondary);
      color: var(--bg-light);
      text-align: center;
    }
    .article-meta {
      margin-bottom: 1rem;
      opacity: 0.8;
    }
    .article-content {
      max-width: 800px;
      margin: 0 auto;
      padding: 3rem 1rem;
    }
    .article-content img {
      width: 100%;
      height: auto;
      border-radius: 8px;
      margin: 1.5rem 0;
    }
    .back-link {
      display: inline-block;
      margin-bottom: 2rem;
      color: var(--primary);
    }
  </style>
</head>
<body>
  <header class="scrolled">
    <nav class="container">
      <a href="../index.html" class="logo">
        <img src="../img/logo.svg" alt="La Intersindical VDD">
      </a>
      <button class="menu-toggle" aria-label="Menú">☰</button>
      <ul class="nav-links">
        <li><a href="../index.html">Inici</a></li>
        <li><a href="../noticias.html">Notícies</a></li>
        <li><a href="../documentos.html">Documents</a></li>
        <li><a href="../contacto.html">Contacte</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <div class="article-header">
      <div class="container">
        <h1 id="article-title">Títol de la Notícia</h1>
        <div class="article-meta">
          <span id="article-date">Data</span>
        </div>
      </div>
    </div>

    <article class="article-content">
      <a href="../noticias.html" class="back-link">← Tornar a les Notícies</a>
      <div id="article-body">
        <!-- Contingut de l'article -->
      </div>
    </article>
  </main>

  <footer>
    <div class="container">
      <div class="footer-bottom">
        <p>&copy; 2026 La Intersindical VDD. Tots els drets reservats.</p>
      </div>
    </div>
  </footer>

  <script>
    // Carregar article individual
    document.addEventListener('DOMContentLoaded', function() {
      const articleBody = document.getElementById('article-body');
      const articleTitle = document.getElementById('article-title');
      const articleDate = document.getElementById('article-date');

      // Obtener datos del artículo desde attributes o JSON
      const title = articleBody.getAttribute('data-title') || 'Notícia';
      const date = articleBody.getAttribute('data-date') || '';
      const content = articleBody.getAttribute('data-content') || '';

      articleTitle.textContent = title;
      articleDate.textContent = date ? new Date(date).toLocaleDateString('ca-ES', { year: 'numeric', month: 'long', day: 'numeric' }) : '';
    });
  </script>
  <script src="../js/main.js"></script>
</body>
</html>
